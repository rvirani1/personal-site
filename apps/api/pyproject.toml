[project]
name = "api"
version = "0.1.0"
description = "Back end for dreamsn.codes: search, brain log, and future ML experiments."
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.160",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["src"]
